[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*,vendor/*,samples/*,scripts/*,downloads/*,tools/*"
export_path="../builds/forge-windows/Verdant.exe"
[preset.0.options]
custom_template/debug="/workspace/toolchains/export-templates/templates/windows_debug_x86_64.exe"
custom_template/release="/workspace/toolchains/export-templates/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false

